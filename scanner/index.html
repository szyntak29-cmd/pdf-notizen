<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scanner"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161c">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Scanner</title>
<style>
:root{--bg:#14161c;--card:#1f232d;--card2:#2a2f3c;--tx:#eef0f6;--sub:#9aa1b4;--acc:#4f8cff;--ok:#3ddc84;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:var(--card2);border-radius:14px;padding:12px 16px;cursor:pointer}
button.pri{background:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.4}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding-top:var(--sat)}
.screen.on{display:flex}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;flex:none}
.bar h1{font-size:18px;margin:0;flex:1}
.foot{display:flex;align-items:center;gap:10px;padding:12px 14px calc(12px + var(--sab));flex:none}
.grow{flex:1}
/* Start */
#home{padding:calc(var(--sat) + 24px) 20px calc(var(--sab) + 20px);align-items:center;justify-content:center;gap:16px;text-align:center}
#home img{width:96px;height:96px;border-radius:22px}
#home h1{margin:4px 0 0;font-size:28px}
#home p{margin:0;color:var(--sub);max-width:320px}
#home .big{width:100%;max-width:340px;padding:18px;font-size:18px}
#msstat{font-size:13px;color:var(--sub)}
/* Kamera */
#cam{background:#000}
#camview{position:relative;flex:1;overflow:hidden;background:#000}
#camview video,#camview canvas{position:absolute;inset:0;width:100%;height:100%}
#camview video{object-fit:contain}
#hint{position:absolute;left:0;right:0;top:10px;text-align:center;font-size:14px;text-shadow:0 1px 4px #000;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.shutter{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid #888;padding:0}
.shutter:active{background:#ccc}
.pill{background:rgba(255,255,255,.14);border-radius:999px;padding:10px 14px;font-size:14px}
.pill.on{background:var(--ok);color:#06210f}
.badge{background:var(--acc);border-radius:999px;padding:2px 9px;font-size:13px;margin-left:6px}
/* Zuschneiden */
#cropwrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#stage{position:relative;touch-action:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.h{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(79,140,255,.35);border:3px solid #fff;touch-action:none}
.seg{display:flex;gap:6px;overflow-x:auto}
.seg button{padding:9px 13px;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff}
/* Seiten */
#grid{flex:1;overflow:auto;padding:6px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.card{background:var(--card);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px}
.card img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff;border-radius:8px}
.card .row{display:flex;gap:6px}
.card .row button{flex:1;padding:8px 0;font-size:15px;border-radius:10px}
.card select{width:100%;background:var(--card2);color:var(--tx);border:0;border-radius:10px;padding:8px;font:inherit;font-size:14px}
.card .n{font-size:12px;color:var(--sub);text-align:center}
/* Dialoge */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.m{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--sab));max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.m h2{margin:0;font-size:19px}
.m input{width:100%;padding:12px;border-radius:12px;border:1px solid #3a4052;background:var(--bg);color:var(--tx);font:inherit}
.m .sub{color:var(--sub);font-size:13px}
.m .list{display:flex;flex-direction:column;gap:8px}
.m .list button{text-align:left}
.m .list small{display:block;color:var(--sub)}
/* Ordner */
#fold{z-index:40}
#flist{flex:1;overflow:auto;padding:0 14px;display:flex;flex-direction:column;gap:6px}
#flist button{text-align:left;background:var(--card)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--sab));background:#000d;padding:10px 16px;border-radius:12px;z-index:99;max-width:88%;display:none;text-align:center}
</style>
</head>
<body>

<!-- Start -->
<div class="screen on" id="home">
  <img src="icon-192.png" alt="">
  <h1>Scanner</h1>
  <p>Dokument fotografieren – wird automatisch erkannt, gerade ausgerichtet und als PDF in deinen OneDrive-Ordner gelegt.</p>
  <button class="pri big" id="h-scan">Dokument scannen</button>
  <button class="big" id="h-photo">Fotos aus der Mediathek</button>
  <button class="big" id="h-pages" style="display:none"></button>
  <div id="msstat"></div>
  <button id="h-ms" style="font-size:14px;padding:8px 14px">OneDrive verbinden</button>
</div>

<!-- Kamera -->
<div class="screen" id="cam">
  <div class="bar"><button id="c-x">✕</button><span class="grow"></span><button class="pill" id="c-auto">Auto</button></div>
  <div id="camview"><video id="vid" playsinline muted autoplay></video><canvas id="ov"></canvas><div id="hint">Dokument ins Bild halten</div><div id="flash"></div></div>
  <div class="foot">
    <button id="c-lib" class="pill">Mediathek</button>
    <span class="grow" style="text-align:center"><button class="shutter" id="c-shot" aria-label="Aufnehmen"></button></span>
    <button id="c-done" class="pill">Fertig<span class="badge" id="c-n">0</span></button>
  </div>
</div>

<!-- Zuschneiden -->
<div class="screen" id="crop">
  <div class="bar"><h1>Ecken prüfen</h1><button id="r-rot">⟳ Drehen</button></div>
  <div id="cropwrap"><div id="stage"><canvas id="cv"></canvas><svg id="sv"><polygon id="poly" fill="rgba(79,140,255,.18)" stroke="#4f8cff" stroke-width="3"/></svg></div></div>
  <div class="foot">
    <button id="r-back">Verwerfen</button>
    <span class="grow"></span>
    <button id="r-auto">Neu erkennen</button>
    <button class="pri" id="r-ok">Übernehmen</button>
  </div>
</div>

<!-- Seiten -->
<div class="screen" id="pages">
  <div class="bar"><button id="p-back">‹ Kamera</button><h1 id="p-title" style="text-align:center">Seiten</h1><button id="p-clear">Leeren</button></div>
  <div id="grid"></div>
  <div class="foot"><button id="p-more">+ Seite</button><span class="grow"></span><button class="pri" id="p-save">Als PDF ablegen</button></div>
</div>

<!-- OneDrive-Ordner wählen -->
<div class="screen" id="fold">
  <div class="bar"><button id="f-up">‹</button><h1 id="f-title">OneDrive</h1><button id="f-new">+ Ordner</button></div>
  <div id="flist"></div>
  <div class="foot"><button id="f-x">Abbrechen</button><span class="grow"></span><button class="pri" id="f-here">Hier speichern</button></div>
</div>

<div id="toast"></div>
<input type="file" id="fin" accept="image/*" multiple hidden>
<input type="file" id="fcap" accept="image/*" capture="environment" hidden>

<script>
"use strict";
// ======================================================================== Einstellungen
// Anwendungs-(Client-)ID aus Microsoft Entra. Kann hier eingetragen oder in der App unter "OneDrive verbinden" gesetzt werden.
const MS_CLIENT_ID = "";
const MS_AUTH = "https://login.microsoftonline.com/consumers/oauth2/v2.0";
const MS_GRAPH = "https://graph.microsoft.com/v1.0";
const MS_SCOPE = "Files.ReadWrite offline_access";
const MAX_SRC = 3000;      // Kantenlaenge des Kamerabilds (Pixel)
const MAX_OUT = 2400;      // Kantenlaenge der fertigen Seite

const $ = (id) => document.getElementById(id);
const S = { pages: [], src: null, quad: null, queue: [], fromCam: false, filter: localStorage.getItem("sc_filter") || "doc", stream: null, auto: localStorage.getItem("sc_auto") !== "0" };
let toastT;
function toast(msg, ms) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = "none", ms || 3500); }
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); if (id === "home") refreshHome(); }
function dialog(html) {
  const bg = document.createElement("div"); bg.className = "mbg"; bg.innerHTML = `<div class="m">${html}</div>`;
  bg.addEventListener("click", (e) => { if (e.target === bg || e.target.hasAttribute("data-x")) bg.remove(); });
  document.body.append(bg); return bg;
}
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function ask(title, val, okText) {
  return new Promise((res) => {
    const bg = dialog(`<h2>${esc(title)}</h2><input id="a-in" autocomplete="off"><div style="display:flex;gap:10px;justify-content:flex-end"><button data-x>Abbrechen</button><button class="pri" id="a-ok">${okText || "OK"}</button></div>`);
    const i = bg.querySelector("#a-in"); i.value = val || ""; setTimeout(() => { i.focus(); i.select(); }, 50);
    let done = false; const fin = (v) => { if (!done) { done = true; bg.remove(); res(v); } };
    bg.querySelector("#a-ok").onclick = () => fin(i.value.trim());
    i.onkeydown = (e) => { if (e.key === "Enter") fin(i.value.trim()); };
    new MutationObserver((_, o) => { if (!bg.isConnected) { o.disconnect(); fin(null); } }).observe(document.body, { childList: true });
  });
}

// ======================================================================== Kantenerkennung (reines JavaScript)
// Eingabe: RGBA-Daten eines verkleinerten Bildes. Ergebnis: 4 Ecken [[x,y]...] (0..1) im Uhrzeigersinn ab links oben, oder null.
function detectQuad(rgba, w, h) {
  const n = w * h;
  let g = new Float32Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) g[i] = 0.299 * rgba[j] + 0.587 * rgba[j + 1] + 0.114 * rgba[j + 2];
  g = boxBlur(boxBlur(g, w, h), w, h);
  const mag = new Float32Array(n); let mx = 0;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x;
    const gx = g[i - w + 1] + 2 * g[i + 1] + g[i + w + 1] - g[i - w - 1] - 2 * g[i - 1] - g[i + w - 1];
    const gy = g[i + w - 1] + 2 * g[i + w] + g[i + w + 1] - g[i - w - 1] - 2 * g[i - w] - g[i - w + 1];
    const m = Math.abs(gx) + Math.abs(gy); mag[i] = m; if (m > mx) mx = m;
  }
  if (mx < 40) return null;
  // Schwelle: ca. die staerksten 9 % der Kanten, mindestens 12 % des Maximums
  const hist = new Uint32Array(256); for (let i = 0; i < n; i++) hist[Math.min(255, (mag[i] / mx * 255) | 0)]++;
  let acc = 0, th = 255; for (; th > 0; th--) { acc += hist[th]; if (acc > n * 0.09) break; }
  const thr = Math.max(th / 255 * mx, 0.12 * mx);
  let mask = new Uint8Array(n); for (let i = 0; i < n; i++) mask[i] = mag[i] >= thr ? 1 : 0;
  mask = dilate(dilate(mask, w, h), w, h);
  // Zusammenhaengende Flecken suchen, jeweils die 4 Eckpunkte (diagonale Extreme) merken
  const lab = new Int32Array(n), stack = new Int32Array(n);
  let best = null, bestA = 0;
  for (let s = 0; s < n; s++) {
    if (!mask[s] || lab[s]) continue;
    let sp = 0, cnt = 0; stack[sp++] = s; lab[s] = 1;
    let tl = s, tr = s, br = s, bl = s, vtl = 1e9, vbr = -1e9, vtr = -1e9, vbl = 1e9;
    while (sp) {
      const i = stack[--sp], x = i % w, y = (i / w) | 0; cnt++;
      const a = x + y, b = x - y;
      if (a < vtl) { vtl = a; tl = i; } if (a > vbr) { vbr = a; br = i; }
      if (b > vtr) { vtr = b; tr = i; } if (b < vbl) { vbl = b; bl = i; }
      if (x > 0 && mask[i - 1] && !lab[i - 1]) { lab[i - 1] = 1; stack[sp++] = i - 1; }
      if (x < w - 1 && mask[i + 1] && !lab[i + 1]) { lab[i + 1] = 1; stack[sp++] = i + 1; }
      if (y > 0 && mask[i - w] && !lab[i - w]) { lab[i - w] = 1; stack[sp++] = i - w; }
      if (y < h - 1 && mask[i + w] && !lab[i + w]) { lab[i + w] = 1; stack[sp++] = i + w; }
    }
    if (cnt < n * 0.004) continue;
    const q = [tl, tr, br, bl].map(i => [(i % w), ((i / w) | 0)]);
    const A = polyArea(q) / n;
    if (A < 0.12 || A > 0.97 || !isConvex(q)) continue;
    const m = Math.min(w, h) * 0.18;
    let ok = true; for (let k = 0; k < 4; k++) { const p = q[k], r = q[(k + 1) % 4]; if (Math.hypot(p[0] - r[0], p[1] - r[1]) < m) ok = false; }
    if (!ok) continue;
    if (A > bestA) { bestA = A; best = q; }
  }
  if (!best) return null;
  // Die Kantenflaeche liegt ein paar Pixel ausserhalb des Blattes: Ecken leicht nach innen ziehen
  const cx = best.reduce((a, p) => a + p[0], 0) / 4, cy = best.reduce((a, p) => a + p[1], 0) / 4, inset = 3.2 * w / 220;
  return best.map(([x, y]) => { const dx = cx - x, dy = cy - y, l = Math.hypot(dx, dy) || 1; return [(x + dx / l * inset) / (w - 1), (y + dy / l * inset) / (h - 1)]; });
}
function boxBlur(a, w, h) {
  const o = new Float32Array(a.length);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0, c = 0;
    for (let dy = -1; dy <= 1; dy++) { const yy = y + dy; if (yy < 0 || yy >= h) continue; for (let dx = -1; dx <= 1; dx++) { const xx = x + dx; if (xx < 0 || xx >= w) continue; s += a[yy * w + xx]; c++; } }
    o[y * w + x] = s / c;
  }
  return o;
}
function dilate(m, w, h) {
  const o = new Uint8Array(m.length);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    o[i] = (m[i] || (x > 0 && m[i - 1]) || (x < w - 1 && m[i + 1]) || (y > 0 && m[i - w]) || (y < h - 1 && m[i + w])) ? 1 : 0;
  }
  return o;
}
function polyArea(q) { let s = 0; for (let i = 0; i < q.length; i++) { const a = q[i], b = q[(i + 1) % q.length]; s += a[0] * b[1] - b[0] * a[1]; } return Math.abs(s) / 2; }
function isConvex(q) {
  let sg = 0;
  for (let i = 0; i < 4; i++) {
    const a = q[i], b = q[(i + 1) % 4], c = q[(i + 2) % 4];
    const cr = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
    if (Math.abs(cr) < 1e-6) return false;
    if (sg && Math.sign(cr) !== sg) return false; sg = Math.sign(cr);
  }
  return true;
}
function detectOnCanvas(cv, width) {
  const w = width || 220, h = Math.max(1, Math.round(cv.height * w / cv.width));
  const t = document.createElement("canvas"); t.width = w; t.height = h;
  const c = t.getContext("2d", { willReadFrequently: true }); c.drawImage(cv, 0, 0, w, h);
  return detectQuad(c.getImageData(0, 0, w, h).data, w, h);
}
const defaultQuad = () => [[.08, .08], [.92, .08], [.92, .92], [.08, .92]];

// ======================================================================== Perspektive geradeziehen
function squareToQuad(p) {   // Einheitsquadrat (0,0)(1,0)(1,1)(0,1) -> Viereck p0..p3
  const [x0, y0] = p[0], [x1, y1] = p[1], [x2, y2] = p[2], [x3, y3] = p[3];
  const dx1 = x1 - x2, dx2 = x3 - x2, dx3 = x0 - x1 + x2 - x3, dy1 = y1 - y2, dy2 = y3 - y2, dy3 = y0 - y1 + y2 - y3;
  let g = 0, hh = 0;
  if (Math.abs(dx3) > 1e-9 || Math.abs(dy3) > 1e-9) {
    const den = dx1 * dy2 - dx2 * dy1;
    g = (dx3 * dy2 - dx2 * dy3) / den; hh = (dx1 * dy3 - dx3 * dy1) / den;
  }
  return { a: x1 - x0 + g * x1, b: x3 - x0 + hh * x3, c: x0, d: y1 - y0 + g * y1, e: y3 - y0 + hh * y3, f: y0, g, h: hh };
}
function warpQuad(srcCv, quadN) {
  const sw = srcCv.width, sh = srcCv.height;
  const q = quadN.map(([x, y]) => [x * sw, y * sh]);
  const len = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  let W = (len(q[0], q[1]) + len(q[3], q[2])) / 2, H = (len(q[0], q[3]) + len(q[1], q[2])) / 2;
  const k = Math.min(1, MAX_OUT / Math.max(W, H)); W = Math.max(16, Math.round(W * k)); H = Math.max(16, Math.round(H * k));
  const M = squareToQuad(q);
  const sd = srcCv.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, sw, sh).data;
  const out = new ImageData(W, H), od = out.data;
  for (let y = 0; y < H; y++) {
    const v = (y + 0.5) / H;
    for (let x = 0; x < W; x++) {
      const u = (x + 0.5) / W, d = M.g * u + M.h * v + 1;
      let fx = (M.a * u + M.b * v + M.c) / d - 0.5, fy = (M.d * u + M.e * v + M.f) / d - 0.5;
      fx = fx < 0 ? 0 : fx > sw - 1.001 ? sw - 1.001 : fx; fy = fy < 0 ? 0 : fy > sh - 1.001 ? sh - 1.001 : fy;
      const x0 = fx | 0, y0 = fy | 0, ax = fx - x0, ay = fy - y0, i = (y0 * sw + x0) * 4, o = (y * W + x) * 4;
      for (let c = 0; c < 3; c++) {
        const t = sd[i + c] * (1 - ax) + sd[i + 4 + c] * ax, b = sd[i + sw * 4 + c] * (1 - ax) + sd[i + sw * 4 + 4 + c] * ax;
        od[o + c] = t * (1 - ay) + b * ay;
      }
      od[o + 3] = 255;
    }
  }
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H; cv.getContext("2d").putImageData(out, 0, 0);
  return cv;
}

// ======================================================================== Filter (Papier weiss, Schrift kraeftig)
function applyFilter(cv, mode) {
  if (mode === "orig") return cv;
  const w = cv.width, h = cv.height, ctx = cv.getContext("2d", { willReadFrequently: true });
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  // Hintergrund (Papierhelligkeit) je Block: Mittel der helleren Haelfte, danach geglaettet
  const B = Math.max(8, Math.round(Math.max(w, h) / 40)), bw = Math.ceil(w / B), bh = Math.ceil(h / B);
  let bg = new Float32Array(bw * bh);
  for (let by = 0; by < bh; by++) for (let bx = 0; bx < bw; bx++) {
    let s = 0, c = 0; const x1 = Math.min(w, (bx + 1) * B), y1 = Math.min(h, (by + 1) * B);
    for (let y = by * B; y < y1; y += 2) for (let x = bx * B; x < x1; x += 2) { const i = (y * w + x) * 4; s += d[i] * .299 + d[i + 1] * .587 + d[i + 2] * .114; c++; }
    const m = s / c; let s2 = 0, c2 = 0;
    for (let y = by * B; y < y1; y += 2) for (let x = bx * B; x < x1; x += 2) { const i = (y * w + x) * 4, v = d[i] * .299 + d[i + 1] * .587 + d[i + 2] * .114; if (v >= m) { s2 += v; c2++; } }
    bg[by * bw + bx] = c2 ? s2 / c2 : m;
  }
  bg = boxBlur(bg, bw, bh);
  const lo = mode === "bw" ? 0.78 : 0.5, hi = mode === "bw" ? 0.78001 : 0.93;
  for (let y = 0; y < h; y++) {
    const gy = Math.min(bh - 1.001, Math.max(0, y / B - 0.5)), y0 = gy | 0, ay = gy - y0;
    for (let x = 0; x < w; x++) {
      const gx = Math.min(bw - 1.001, Math.max(0, x / B - 0.5)), x0 = gx | 0, ax = gx - x0, k = y0 * bw + x0;
      const b = Math.max(40, (bg[k] * (1 - ax) + bg[k + 1] * ax) * (1 - ay) + (bg[k + bw] * (1 - ax) + bg[k + bw + 1] * ax) * ay);
      const i = (y * w + x) * 4;

const msClientId = () => localStorage.getItem("sc_ms_cid") || MS_CLIENT_ID;

  const state = b64u(crypto.getRandomValues(new Uint8Array(12)));

  location.href = MS_AUTH + "/authorize?" + new URLSearchParams({ client_id: msClientId(), response_type: "code", redirect_uri: msRedirect(), response_mode: "query", scope: MS_SCOPE, state, code_challenge: c, code_challenge_method: "S256", prompt: "select_account" });

    <button id="s-share">Teilen / In „Dateien“ sichern</button>
    <button data-x>Abbrechen</button>`);
  const name = () => (bg.querySelector("#s-name").value.trim().replace(/[<>:"/\\|?*]/g, "_").replace(/\.pdf$/i, "") || stamp()) + ".pdf";
  const needLogin = async () => {
    if (!msClientId()) { bg.remove(); msSetup(); return true; }
    if (!msLoggedIn()) { bg.remove(); if (confirm("Zum Anmelden verlässt die App kurz die Seite – deine Scans bleiben erhalten. Jetzt anmelden?")) { await savePending(); msLogin("save"); } return true; }
    return false;
  };
  const upload = async (folder, fname) => {
    toast("Erzeuge PDF …", 30000);
    try {
      const bytes = await exportPdf(); toast("Lade in OneDrive hoch …", 30000);
      const item = await msUpload(folder.id, fname, bytes);
      rememberFolder(folder); S.pages = []; S.lastName = null;
      dialog(`<h2>Gespeichert ✓</h2><div class="sub">${esc(item && item.name || fname)}<br>in ${esc(folder.path || folder.name)}</div><button class="pri" data-x id="s-new">Nächster Scan</button>`).querySelector("#s-new").addEventListener("click", () => show("home"));
      toast("Fertig", 1200);
    } catch (e) { show("pages"); toast("Speichern fehlgeschlagen: " + e.message, 9000); }
  };
  bg.querySelector("#s-pick").onclick = async () => {
    const fname = name(); S.lastName = fname.replace(/\.pdf$/i, "");
    if (await needLogin()) return;
    bg.remove(); const f = await pickFolder(); if (!f) { saveDialog(); return; }
    upload(f, fname);
  };
  const recEl = bg.querySelector("#s-rec");
  if (recEl) recEl.onclick = async (e) => { const b = e.target.closest("button"); if (!b) return; const fname = name(); if (await needLogin()) return; bg.remove(); upload(rec[+b.dataset.i], fname); };
  bg.querySelector("#s-share").onclick = async () => {
    const fname = name(); bg.remove(); toast("Erzeuge PDF …", 20000);
    try {
      const bytes = await exportPdf(), file = new File([bytes], fname, { type: "application/pdf" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: fname }); }
      else { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = fname; a.click(); }
      toast("Fertig", 1500);
    } catch (e) { if (e.name !== "AbortError") toast("Teilen fehlgeschlagen: " + e.message, 6000); }
  };
}

// ---- Scans ueber die Microsoft-Anmeldung hinweg zwischenspeichern
const idb = () => new Promise((res, rej) => { const r = indexedDB.open("scanner", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function idbSet(k, v) { const d = await idb(); return new Promise((res) => { const t = d.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => res(); }); }
async function idbGet(k) { const d = await idb(); return new Promise((res) => { const t = d.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(undefined); }); }
async function savePending() { await idbSet("pending", S.pages.map(p => ({ blob: p.blob, filter: p.filter, rot: p.rot }))); }
async function restorePending() {
  const l = await idbGet("pending"); if (!l || !l.length) return; await idbSet("pending", null);
  for (const p of l) { const c = await blobToCanvas(p.blob); S.pages.push({ blob: p.blob, small: cloneCanvas(c, 420), filter: p.filter, rot: p.rot }); }
}

  const b = $("h-pages"); b.style.display = S.pages.length ? "" : "none"; b.textContent = "Aktueller Scan (" + S.pages.length + " Seiten)";
}
$("h-scan").onclick = openCamera; $("h-photo").onclick = pickPhotos; $("h-pages").onclick = openPages;
$("h-ms").onclick = () => { if (msLoggedIn()) { localStorage.removeItem("sc_ms_tok"); refreshHome(); toast("Abgemeldet"); } else msLogin(""); };
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
refreshHome(); msHandleRedirect();
window.__sc = { detectQuad, warpQuad, applyFilter, buildPdf, squareToQuad, S };
